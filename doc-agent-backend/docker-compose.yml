services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docagent
      POSTGRES_USER: ${POSTGRES_USER:-docagent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yourpassword123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docagent_user}:${POSTGRES_PASSWORD:-yourpassword123}@db:5432/docagent
      REDIS_URL: redis://redis:6379/0
      TESSERACT_CMD: tesseract

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app worker --loglevel=info
    depends_on:
      - db
      - redis
      - api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docagent_user}:${POSTGRES_PASSWORD:-yourpassword123}@db:5432/docagent
      REDIS_URL: redis://redis:6379/0
      TESSERACT_CMD: tesseract

volumes:
  postgres_data:
